[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hivesplit"
version = "1.0.0"
description = "Apiary hive split genealogy tracker: hives, splits, queens, typed inspections and a deterministic swarm-risk score in one local JSON file."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = []

[project.scripts]
hivesplit = "hivesplit:main"

[tool.setuptools]
py-modules = ["hivesplit"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
